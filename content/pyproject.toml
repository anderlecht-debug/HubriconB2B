[project]
name = "hubricon-content"
version = "0.1.0"
description = "Hubricon's content pipeline: scripts, Manim scenes, narration, assembly, QA and review gates, driven by real engine runs on labelled demo data."
requires-python = ">=3.13,<3.14"
dependencies = [
    "manim>=0.19",
    "numpy>=2.0",
    "pillow>=10",
    "openpyxl>=3.1",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "soundfile>=0.12",
    "pytest>=8.0",
    "markdown>=3.5",
    "fonttools>=4.50",
]

[project.optional-dependencies]
# The CUDA libraries let faster-whisper align on the GPU; without them it runs on the CPU.
# av<19: faster-whisper 1.2 passes an argument PyAV 19 removed (found 2026-10-04).
voice = ["kokoro-onnx>=0.4", "faster-whisper>=1.0", "av<19", "nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9.1,<10"]
# Sourcing filters (VISUAL_SPEC §6.4): faces (YuNet), duplicates, text in frame.
visual = ["opencv-python-headless>=4.10", "imagehash>=4.3", "pytesseract>=0.3.10"]

[project.scripts]
hubricon-content = "hubricon_content.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubricon_content"]

[tool.pytest.ini_options]
testpaths = ["tests"]
