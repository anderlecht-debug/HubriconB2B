name: Weekly sweep

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC — before the US business day
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The five secrets live in the "Production" environment (Settings →
    # Environments), not in Repository secrets. A job only sees environment
    # secrets when it declares that environment, so this line is what makes
    # ${{ secrets.* }} below resolve.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The sweep exits in seconds with a one-line error when a secret is
      # missing; this step names the culprit in the Actions UI instead.
      # Add them under Settings → Secrets and variables → Actions.
      - name: Check repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          FOUNDER_EMAIL: ${{ secrets.FOUNDER_EMAIL }}
        run: |
          missing=""
          for k in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "$(printenv "$k")" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Required secret(s) not set:$missing — add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          for k in RESEND_API_KEY ALERT_FROM FOUNDER_EMAIL; do
            [ -n "$(printenv "$k")" ] || echo "::warning::$k is not set — the sweep will run but send no alert emails."
          done
          echo "Secrets present."
      - name: Run the always-on sweep
        working-directory: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          FOUNDER_EMAIL: ${{ secrets.FOUNDER_EMAIL }}
        run: uv run hubricon sweep --alert --issue
      # --issue is what makes "Before it goes live" a schedule rather than a
      # habit: it promotes the top drafts to issued and emails the client the
      # planned moves with their expected dollars BEFORE anything happens.
      # Nothing auto-approves on a send that failed — issue.py leaves
      # veto_closes_at NULL when the notice does not go out, so a silent inbox
      # can never become a yes.
      # What consenting clients' real accounts say the cold engine's guesses
      # should be (calibration.py). Reads only clients who granted the
      # separate 'calibration' consent; writes 'insufficient' until enough
      # accounts stand behind a figure. Never fails the sweep.
      - name: Calibrate the cold engine from consenting accounts
        if: always()
        working-directory: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run hubricon calibrate || echo "::warning::calibration did not run"
