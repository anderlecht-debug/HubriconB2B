[project]
name = "hubricon-engine"
version = "0.1.0"
description = "Hubricon analytics engine: CSV ingest, models, client reports"
requires-python = ">=3.12"
dependencies = [
    "supabase>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
hubricon = "hubricon_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubricon_engine"]
